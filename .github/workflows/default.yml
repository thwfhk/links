name: SmallLinks

on:
  pull_request:
    branches: [master, small]
  push:
    branches: [master, small]
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

jobs:
  rule-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Check source files
        run: make rule-check

  interpreter:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - 5.3.0

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - run: opam install -y ounit2
      - name: Install SmallLinks dependencies
        run: opam install -y ./links.opam --deps-only
      - name: Build SmallLinks from source
        run: make all-ci
      - name: Run regression tests
        run: make tests
      - name: Check installed SmallLinks
        run: |
          prefix=$(mktemp -d)
          trap 'rm -rf "$prefix"' EXIT
          opam exec -- dune install --profile=ci --prefix="$prefix" links
          ./tests/check-install.sh "$prefix/bin/linx"
        shell: bash
      - name: Run OCaml unit tests
        run: opam exec -- ./run-tests unit-tests

name: Links main workflow

on:
  pull_request:
    branches: master
  push:
    branches: [master]
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

jobs:
  rule-check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - 5.3.0

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - run: git diff-index --quiet HEAD --
        shell: bash

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Ad-hoc rule check
        run: |
          eval $(opam config env)
          make rule-check
        shell: bash

  build-doc:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install system dependencies
        run: |
          sudo apt-get install -y python3-setuptools python3-pip
          pip3 install -U Sphinx
        shell: bash

      - name: Compile documentation
        run: make doc
        shell: bash

  interpreter:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - 5.3.0

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: opam install -y ounit2

      - name: Install Links dependencies
        run: >-
          opam install
          ./links.opam
          --deps-only

      - name: Build Links from source
        run: |
          eval $(opam env)
          make all-ci
        shell: bash

      - name: Run interpreter testsuite
        run: |
          eval $(opam env)
          make tests
          ./run-tests nodb-unit-tests
        shell: bash

  js-runtime-lint:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup NPM
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install jshint
        run: npm install jshint

      - name: Run jshint
        run: npm exec jshint -- --config lib/js/jshint.config.json --show-non-errors lib/js/jslib.js

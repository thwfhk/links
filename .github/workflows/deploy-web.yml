name: Deploy SmallLinks demo

on:
  push:
    branches: [small-web]

permissions:
  contents: read

concurrency:
  group: smalllinks-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: opam install -y ./links.opam --deps-only
      - run: opam install -y js_of_ocaml-lwt.6.2.0
      - run: npm --prefix web ci
      - run: make web-demo
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

name: Deploy SmallLinks demo

on:
  push:
    branches: [small-web]

permissions:
  contents: read

concurrency:
  group: smalllinks-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Binaryen 123
        run: |
          cd "$RUNNER_TEMP"
          binaryen_archive=binaryen-version_123-x86_64-linux.tar.gz
          binaryen_release=https://github.com/WebAssembly/binaryen/releases/download/version_123
          curl --fail --location --output "$binaryen_archive" "$binaryen_release/$binaryen_archive"
          curl --fail --location --output "$binaryen_archive.sha256" "$binaryen_release/$binaryen_archive.sha256"
          sha256sum --check "$binaryen_archive.sha256"
          tar -xzf "$binaryen_archive"
          echo "$RUNNER_TEMP/binaryen-version_123/bin" >> "$GITHUB_PATH"
      - run: opam install -y ./links.opam --deps-only
      - run: opam install -y js_of_ocaml-lwt.6.5.0 wasm_of_ocaml-compiler.6.5.0
      - run: npm --prefix web ci
      - run: make test-web-runtime test-web-runtime-wasm test-web-demo
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

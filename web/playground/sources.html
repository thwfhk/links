<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmallLinks Sources</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./sources.js" type="module"></script>
    <style>
      .source-browser {
        max-inline-size: 88rem;
        margin-inline: auto;
        padding: 0 clamp(1rem, 4vw, 3rem) 2rem;
      }

      .source-browser a {
        color: var(--accent);
        text-underline-offset: 0.2em;
      }

      .source-layout {
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 3fr);
        align-items: start;
        gap: 1rem;
      }

      .source-browser .panel {
        padding: 1rem;
        overflow-wrap: anywhere;
      }

      .source-view[hidden] + .source-list {
        grid-column: 1 / -1;
        inline-size: min(100%, 44rem);
        justify-self: center;
      }

      .source-browser .status:not(:empty) {
        margin-block-end: 0.75rem;
      }

      .source-directory {
        margin-block-start: 0.75rem;
        padding-block-start: 0.75rem;
        border-block-start: 1px solid var(--border);
      }

      .source-directory summary {
        cursor: pointer;
        font: 0.875rem/1.6 var(--code-font);
      }

      .source-directory ul, .source-related ul {
        margin-block: 0.35rem 0;
        padding-inline-start: 1.5rem;
      }

      .source-directory a {
        display: inline-block;
        padding: 0.125rem 0.25rem;
        font: 0.875rem/1.6 var(--code-font);
      }

      .source-directory a[aria-current="page"] {
        border-radius: 0.25rem;
        background: var(--code-surface);
        font-weight: 700;
      }

      .source-path, .source-kind, .source-note, .source-related {
        margin-block: 0.5rem 0;
      }

      .source-path, .source-kind {
        color: var(--muted);
        font-size: 0.875rem;
      }

      .source-path code { font-family: var(--code-font); }

      .source-action:not([hidden]) {
        display: inline-block;
        margin-block-start: 0.5rem;
        font-weight: 600;
      }

      .source-related h3 { margin: 0; font-size: 0.875rem; }

      .source-related li > a + a { margin-inline-start: 0.75rem; }

      .source-preview {
        margin: 0.75rem 0 0;
        max-block-size: min(65vh, 44rem);
        padding: 0.75rem 1rem;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        background: var(--code-surface);
        white-space: pre;
        overflow-wrap: normal;
        tab-size: 2;
      }

      .source-preview code { font: 0.875rem/1.6 var(--code-font); }

      @media (max-width: 48rem) {
        .source-layout { grid-template-columns: minmax(0, 1fr); }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <h1>SmallLinks Sources</h1>
      <nav class="site-links" aria-label="SmallLinks">
        <a href="./index.html">Playground</a>
        <a href="./guide.html">Language guide</a>
      </nav>
    </header>

    <main class="source-browser">
      <p id="source-status" class="status" role="status"></p>
      <noscript>
        <p class="status">Enable JavaScript to browse the source catalogue.</p>
      </noscript>
      <div class="source-layout">
        <article class="panel source-view" aria-labelledby="source-title" hidden>
          <h2 class="panel-title" id="source-title"></h2>
          <p class="source-path"><code id="source-path"></code></p>
          <p class="source-kind" id="source-kind"></p>
          <p class="source-note" id="source-note" hidden></p>
          <a class="source-action" id="source-playground" hidden></a>
          <section class="source-related" aria-labelledby="source-imports-title" hidden>
            <h3 id="source-imports-title">Imports</h3>
            <ul id="source-imports"></ul>
          </section>
          <section class="source-related" aria-labelledby="source-callers-title" hidden>
            <h3 id="source-callers-title">Called by</h3>
            <ul id="source-callers"></ul>
          </section>
          <p id="source-preview-status" class="status" role="status"></p>
          <pre class="source-preview" tabindex="0" role="region" aria-label="Source code" hidden><code id="source-code"></code></pre>
        </article>

        <nav class="panel source-list" id="source-files" aria-labelledby="source-files-title" hidden>
          <h2 class="panel-title" id="source-files-title">Files by directory</h2>
        </nav>
      </div>
    </main>
  </body>
</html>
